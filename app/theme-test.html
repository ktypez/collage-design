<!doctype html>
<html lang="en" data-mode="light">
<head>
  <meta charset="utf-8">
  <title>theme smoke test</title>
  <link rel="stylesheet" href="../src/tokens/schema.css">
  <link id="themeLink" rel="stylesheet" href="../themes/mcky/theme.css">
  <link rel="stylesheet" href="../src/components/base.css">
  <style>
    body { font-family: var(--font-sans); padding: 2rem; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 600; }
    .row { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; align-items: center; }
    .swatch { width: 60px; height: 60px; border-radius: var(--radius); border: var(--border-width) solid hsl(var(--border)); }
    .meta { font-size: 12px; color: hsl(var(--muted-foreground)); font-family: var(--font-mono); margin-top: 0.5rem; }
    .ok { color: hsl(var(--success)); }
    .err { color: hsl(var(--destructive)); }
  </style>
  <style>
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.875rem 1.5rem; border-bottom: 1px solid hsl(var(--border)); margin: -2rem -1.5rem 2rem; }
    .topbar .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 14px; }
    .topbar .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--primary)); box-shadow: 0 0 8px hsl(var(--primary) / 0.4); }
    .topbar nav { display: flex; gap: 1rem; font-size: 13px; }
    .topbar nav a { color: hsl(var(--muted-foreground)); }
    .topbar nav a:hover, .topbar nav a.on { color: hsl(var(--foreground)); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Theme Test</div>
    <nav>
      <a href="index.html">home</a>
      <a href="showcase.html">showcase</a>
      <a href="playground.html">playground</a>
      <a href="theme-builder.html">builder</a>
      <a href="registry.html">registry</a>
      <a href="theme-test.html" class="on">test</a>
    </nav>
  </div>

  <h1 id="title">theme: mcky</h1>
  <div class="meta" id="meta">-- testing --</div>

  <div class="row">
    <button class="x-btn primary">primary</button>
    <button class="x-btn outline">outline</button>
    <button class="x-btn destructive">destructive</button>
  </div>

  <div class="row" id="swatches">
    <div class="swatch" title="background" style="background: hsl(var(--background))"></div>
    <div class="swatch" title="foreground" style="background: hsl(var(--foreground))"></div>
    <div class="swatch" title="primary" style="background: hsl(var(--primary))"></div>
    <div class="swatch" title="accent" style="background: hsl(var(--accent))"></div>
    <div class="swatch" title="destructive" style="background: hsl(var(--destructive))"></div>
    <div class="swatch" title="success" style="background: hsl(var(--success))"></div>
  </div>

  <div class="row">
    <div class="x-card" style="max-width: 300px">
      <div class="x-card-header"><div class="x-card-title">Card title</div></div>
      <div class="x-card-content">content with theme tokens</div>
    </div>
    <span class="x-badge">default</span>
    <span class="x-badge success">success</span>
    <span class="x-status ok">online</span>
  </div>

  <hr style="margin: 2rem 0; border: 0; border-top: 1px solid hsl(var(--border))">

  <div class="row">
    <label>theme:
      <select id="themeSelect">
        <option value="mcky">mcky</option>
        <option value="rack">rack</option>
        <option value="crt">crt</option>
        <option value="noc">noc</option>
        <option value="min">min</option>
        <option value="glitchpage">glitchpage</option>
        <option value="claude">claude</option>
        <option value="moss">moss</option>
        <option value="brut">brut</option>
      </select>
    </label>
    <label>mode:
      <select id="modeSelect">
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </label>
  </div>

  <script>
    const link = document.getElementById('themeLink');
    const title = document.getElementById('title');
    const meta = document.getElementById('meta');
    const ts = document.getElementById('themeSelect');
    const ms = document.getElementById('modeSelect');

    async function load() {
      const t = ts.value;
      link.href = `../themes/${t}/theme.css`;
      document.documentElement.dataset.mode = ms.value;
      title.textContent = `theme: ${t}`;
      // fetch theme.json for meta
      try {
        const r = await fetch(`../themes/${t}/theme.json`);
        const j = await r.json();
        meta.innerHTML = `<span class="ok">✓ loaded</span> · ${j.name} · modes: ${j.modes} · vibe: ${j.vibe}`;
      } catch (e) {
        meta.innerHTML = `<span class="err">✗ ${e.message}</span>`;
      }
    }
    ts.addEventListener('change', load);
    ms.addEventListener('change', load);
    load();
  </script>
</body>
</html>
